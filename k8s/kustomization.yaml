apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/todo-backend
    newTag: latest
  - name: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/todo-frontend
    newTag: latest
